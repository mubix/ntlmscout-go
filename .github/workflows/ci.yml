name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"
          cache: false   # no go.sum: this module has no third-party deps
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # so `git describe` in the Makefile sees tags
      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"
          cache: false   # no go.sum: this module has no third-party deps
      # The platform matrix lives in the Makefile (PLATFORMS), not here.
      - name: Build all platforms
        run: |
          VER="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VER="dev-${GITHUB_SHA::7}"
          make -j"$(nproc)" release VERSION="${VER}"
          ls -l dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ntlmscout-binaries
          path: dist/

  release:
    name: Attach binaries to release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ntlmscout-binaries
          path: dist
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ntlmscout-*
            dist/SHA256SUMS
